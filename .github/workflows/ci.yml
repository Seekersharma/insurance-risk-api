name: ML CI

on:
  push:
    branches:
       - main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - run: pip install -r requirements.txt

      - run: pwd

      - run: ls -R

      - run python-c "import sys; print(sys.path)"

      - run: pytest
      
      - run: python src/train.py

      - run: ls models